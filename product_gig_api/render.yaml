services:
  - type: web
    name: product-gig-github-api
    runtime: python
    rootDir: product_gig_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ACTION_API_KEY
        sync: false          # set manually in Render dashboard – never commit the value
      - key: GITHUB_TOKEN
        sync: false          # fine-grained PAT, Contents: Read & Write, set in dashboard
      - key: GITHUB_REPO
        value: rohan-099nyx/self_study
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_DIR
        value: product-gigs
